<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zepto procurement request: requested and proposed flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --font:"Rubik",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --bg:#F4FFF7; --surface:#FFFFFF; --lane:rgba(255,255,255,.66); --lane-line:rgba(17,17,17,.06);
  --ink:#111111; --muted:#58595B; --line:rgba(17,17,17,.12); --line-strong:rgba(17,17,17,.2);
  --green:#17B14A; --green-ink:#0B7A31; --green-soft:#E2F7E9;
  --zepto:#950EDB; --zepto-ink:#7A0BB5; --zepto-soft:#F4E8FC; --zepto-solid:#950EDB;
  --grad:linear-gradient(135deg,#6BC8F4 0%,#5DE283 100%);
  --loop:#C8650F; --email:#58595B; --data:#8A8B8D;
  --label-bg:#FFFFFF;
  --shadow-soft:0 1px 2px rgba(0,0,0,.06),0 2px 6px rgba(0,0,0,.06);
  --shadow-card:0 4px 9px rgba(0,0,0,.10),0 16px 16px rgba(0,0,0,.09),0 36px 22px rgba(0,0,0,.05),0 64px 26px rgba(0,0,0,.01);
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#0C1611; --surface:#14221B; --lane:rgba(255,255,255,.035); --lane-line:rgba(234,245,238,.07);
  --ink:#EAF5EE; --muted:#A7B6AC; --line:rgba(234,245,238,.14); --line-strong:rgba(234,245,238,.26);
  --green:#3FD06A; --green-ink:#6BE891; --green-soft:rgba(93,226,131,.13);
  --zepto:#C47BFF; --zepto-ink:#D9A8FF; --zepto-soft:rgba(196,123,255,.15);
  --loop:#F2A65A; --email:#A7B6AC; --data:#7E8C83; --label-bg:#14221B;
  --shadow-soft:0 1px 2px rgba(0,0,0,.4); --shadow-card:0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  html:not([data-theme="light"]){
    --bg:#0C1611; --surface:#14221B; --lane:rgba(255,255,255,.035); --lane-line:rgba(234,245,238,.07);
    --ink:#EAF5EE; --muted:#A7B6AC; --line:rgba(234,245,238,.14); --line-strong:rgba(234,245,238,.26);
    --green:#3FD06A; --green-ink:#6BE891; --green-soft:rgba(93,226,131,.13);
    --zepto:#C47BFF; --zepto-ink:#D9A8FF; --zepto-soft:rgba(196,123,255,.15);
    --loop:#F2A65A; --email:#A7B6AC; --data:#7E8C83; --label-bg:#14221B;
    --shadow-soft:0 1px 2px rgba(0,0,0,.4); --shadow-card:0 12px 32px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
body[data-mode="req"]{--accent:var(--zepto);--accent-ink:var(--zepto-ink);--accent-soft:var(--zepto-soft)}
body[data-mode="prop"]{--accent:var(--green);--accent-ink:var(--green-ink);--accent-soft:var(--green-soft)}

*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body.walking{padding-bottom:96px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{padding:18px clamp(14px,2.4vw,32px) 28px;max-width:1720px;margin:0 auto}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:14px}
.logo{display:block;height:auto}
.logo-z{width:96px}
.logo-wd{width:132px}
.logo-dark{display:none}
html[data-theme="dark"] .logo-dark{display:block}
html[data-theme="dark"] .logo-light{display:none}
@media (prefers-color-scheme: dark){
  html:not([data-theme="light"]) .logo-dark{display:block}
  html:not([data-theme="light"]) .logo-light{display:none}
}
.band{height:5px;border-radius:999px;background:var(--zepto-solid);margin-bottom:18px;transition:background .3s}
body[data-mode="prop"] .band{background:var(--grad)}
.heading{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:16px}
h1{font-size:clamp(1.35rem,1.1rem + 1vw,2rem);line-height:1.15;letter-spacing:-.02em;margin:0 0 6px;font-weight:700}
.lede{margin:0;color:var(--muted);max-width:68ch}

/* controls */
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px;margin-bottom:12px}
.modes{display:inline-flex;background:var(--surface);border-radius:999px;padding:5px;box-shadow:var(--shadow-soft);gap:4px}
.mode-btn{border:0;background:transparent;border-radius:999px;padding:8px 20px 9px;cursor:pointer;text-align:left;display:grid;line-height:1.2;min-width:150px}
.mode-btn .m-t{font-weight:600;font-size:.98rem}
.mode-btn .m-c{font-size:.75rem;color:var(--muted)}
.mode-btn[aria-pressed="true"][data-mode="req"]{background:var(--zepto-solid);color:#fff}
.mode-btn[aria-pressed="true"][data-mode="req"] .m-c{color:rgba(255,255,255,.85)}
.mode-btn[aria-pressed="true"][data-mode="prop"]{background:var(--grad);color:#111}
.mode-btn[aria-pressed="true"][data-mode="prop"] .m-c{color:#1d3a27}
.mode-btn[aria-pressed="false"]:hover{background:var(--accent-soft)}
.spacer{flex:1}
.seg{display:inline-flex;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line-strong);padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 13px;cursor:pointer;font-size:.86rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:500}
.btn{border:0;border-radius:999px;padding:8px 16px;cursor:pointer;font-size:.88rem;font-weight:500;display:inline-flex;align-items:center;gap:8px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-strong)}
.btn:hover{box-shadow:inset 0 0 0 1px var(--accent)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:#fff;box-shadow:none}
body[data-mode="prop"] .btn.primary{background:var(--green-ink)}
html[data-theme="dark"] body[data-mode="prop"] .btn.primary{background:#17B14A;color:#fff}
html[data-theme="dark"] body[data-mode="req"] .btn.primary{background:var(--zepto-solid)}
@media (prefers-color-scheme: dark){
  html:not([data-theme="light"]) body[data-mode="prop"] .btn.primary{background:#17B14A;color:#fff}
  html:not([data-theme="light"]) body[data-mode="req"] .btn.primary{background:var(--zepto-solid)}
}
.btn.icon{padding:8px;width:38px;height:38px;justify-content:center}
.btn svg,.ico{width:18px;height:18px;flex:none}
.scen-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:16px}
.scen-row .lbl{font-size:.82rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;border-radius:999px;padding:5px 12px;font-size:.82rem;cursor:pointer;background:transparent;box-shadow:inset 0 0 0 1px var(--line-strong);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent-ink);font-weight:500}
.scen-desc{font-size:.82rem;color:var(--muted)}

/* main layout */
.main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.canvas{overflow-x:auto;overflow-y:visible;padding:2px 2px 6px;border-radius:20px}
.board{position:relative;display:grid;grid-template-columns:repeat(4,minmax(170px,1fr));column-gap:48px;min-width:820px}
.lane{display:grid;grid-template-rows:subgrid;background:var(--lane);border-radius:20px;padding:0 14px 14px;box-shadow:inset 0 0 0 1px var(--lane-line);min-width:0}
.lane-head{position:relative;z-index:2;grid-row:1;display:flex;gap:9px;align-items:flex-start;text-align:left;border:0;background:transparent;cursor:pointer;padding:14px 4px 10px;border-radius:14px}
.lane-head .ico{margin-top:2px;color:var(--accent-ink)}
.lane-head .lh-title{display:block;font-weight:600;font-size:.92rem;line-height:1.25}
.lane-head .lh-who{display:block;font-size:.74rem;color:var(--muted);line-height:1.3;margin-top:2px}
.lane-head:hover .lh-title,.lane-head[aria-pressed="true"] .lh-title{color:var(--accent-ink);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px}
.bw{position:relative;z-index:2;padding:14px 0;align-self:center;min-width:0;transition:opacity .2s}
.block{position:relative;width:100%;display:grid;gap:5px;text-align:left;cursor:pointer;background:var(--surface);border:1.5px solid var(--line-strong);border-radius:14px;padding:10px 12px 11px;box-shadow:var(--shadow-soft);transition:border-color .15s,box-shadow .15s,transform .15s}
.block:hover{border-color:var(--accent)}
.block:active{transform:scale(.98)}
.block.t-sys{background:var(--accent-soft);border-color:transparent}
.block.t-sys:hover{border-color:var(--accent)}
.block.t-outside{background:var(--bg);border-style:dashed;box-shadow:none}
.block.s-future{background:var(--bg);border-style:dashed;box-shadow:none}
.block.s-new{border-color:var(--green)}
.b-meta{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.b-meta:empty{display:none}
.b-ico{width:15px;height:15px;color:var(--accent-ink)}
.b-title{font-weight:500;font-size:.88rem;line-height:1.3}
.b-ref{font-size:.72rem;color:var(--muted)}
.b-tag{font-size:.7rem;color:var(--muted);font-weight:500}
.badge{font-size:.68rem;font-weight:600;border-radius:999px;padding:1px 8px;line-height:1.5}
.badge.b-new{background:#17B14A;color:#fff}
.badge.b-enhanced{box-shadow:inset 0 0 0 1.25px var(--green);color:var(--green-ink)}
.badge.b-optional{box-shadow:inset 0 0 0 1.25px #2A8CC0;color:#1F6E99}
.badge.b-future{box-shadow:inset 0 0 0 1.25px var(--muted);color:var(--muted);border:0}
html[data-theme="dark"] .badge.b-optional{color:#8FD3F7;box-shadow:inset 0 0 0 1.25px #6BC8F4}
@media (prefers-color-scheme: dark){html:not([data-theme="light"]) .badge.b-optional{color:#8FD3F7;box-shadow:inset 0 0 0 1.25px #6BC8F4}}
.b-num{position:absolute;top:-9px;left:-8px;min-width:22px;height:22px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:.72rem;font-weight:600;display:none;align-items:center;justify-content:center;padding:0 6px}
.bw.has-num .b-num{display:flex}
.bw.is-sel .block{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent),var(--shadow-soft)}
.bw.is-sel .b-num{background:var(--accent);color:#fff}
.bw.is-linked .block{border-color:color-mix(in srgb,var(--accent) 60%,transparent)}
.bw.faded{opacity:.28}
.bw.dim{opacity:.4}
.bw.faded.dim{opacity:.18}
.sub-btn{display:inline-flex;align-items:center;gap:4px;border:0;background:transparent;cursor:pointer;font-size:.76rem;color:var(--muted);padding:5px 4px 0}
.sub-btn:hover{color:var(--accent-ink)}
.sub-btn svg{width:13px;height:13px;transition:transform .15s}
.sub-btn[aria-expanded="true"] svg{transform:rotate(90deg)}
.sub{list-style:none;margin:4px 0 0;padding:0 0 0 12px;border-left:1.5px dashed var(--line-strong);margin-left:9px;counter-reset:s}
.sub li{font-size:.78rem;line-height:1.35;padding:4px 0 4px 8px;position:relative;color:var(--ink);counter-increment:s}
.sub li::before{content:counter(s)".";color:var(--muted);margin-right:5px;font-size:.72rem}
.edges{position:absolute;top:0;left:0;pointer-events:none;z-index:1;overflow:visible}
.edges .edge path{fill:none;stroke-width:1.8;transition:opacity .2s,stroke-width .15s}
.e-flow path{stroke:var(--accent)}
.e-loop path{stroke:var(--loop);stroke-dasharray:7 5}
.e-email path{stroke:var(--email);stroke-dasharray:1.5 4.5;stroke-linecap:round;stroke-width:2.2}
.e-data path{stroke:var(--data);stroke-dasharray:9 5;stroke-width:1.3}
.mk-flow{fill:var(--accent)} .mk-loop{fill:var(--loop)} .mk-email{fill:var(--email)} .mk-data{fill:var(--data)}
.edge .elabel rect{fill:var(--label-bg);stroke:var(--line)}
.edge .elabel text{font-family:var(--font);font-size:10.5px;fill:var(--muted)}
.edge.faded{opacity:.1}
.edge.dim{opacity:.16}
.edge.hl path{stroke-width:3}
.edge.hl.e-email path{stroke-width:3}
.edge.hl .elabel text{fill:var(--ink);font-weight:500}

/* legend */
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;margin-top:14px;padding:12px 14px;font-size:.78rem;color:var(--muted);border-radius:16px;background:var(--lane);box-shadow:inset 0 0 0 1px var(--lane-line)}
.legend .lg{display:inline-flex;align-items:center;gap:8px}
.legend svg{width:34px;height:10px;overflow:visible}
.legend .sw{width:22px;height:14px;border-radius:5px;border:1.5px solid var(--line-strong);background:var(--surface)}
.legend .sw.sys{background:var(--accent-soft);border-color:transparent}
.legend .sw.out{background:var(--bg);border-style:dashed}
.legend .lg-title{font-weight:600;color:var(--ink)}

/* panel */
.panel{position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto;background:var(--surface);border-radius:24px;box-shadow:var(--shadow-card);overscroll-behavior:contain}
.panel-strip{height:6px;background:var(--zepto-solid);border-radius:24px 24px 0 0;position:sticky;top:0}
body[data-mode="prop"] .panel-strip{background:var(--grad)}
.panel-inner{padding:16px 22px 22px}
.p-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.p-kick{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.lane-chip{border:0;cursor:pointer;font-size:.76rem;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-weight:500;display:inline-flex;align-items:center;gap:5px}
.lane-chip .ico{width:13px;height:13px}
.p-ref{font-size:.76rem;color:var(--muted)}
.sheet-close{display:none}
.panel h2{font-size:1.3rem;line-height:1.2;letter-spacing:-.015em;margin:0 0 4px;font-weight:700}
.panel h2:focus{outline:none}
.p-sub{color:var(--muted);font-size:.86rem;margin:0 0 6px}
.panel h3{font-size:.84rem;font-weight:600;margin:18px 0 5px;color:var(--accent-ink)}
.panel p{margin:0;font-size:.92rem;line-height:1.55}
.panel ul{margin:0;padding-left:18px;font-size:.9rem}
.panel li{margin:4px 0;line-height:1.45}
.callout{margin-top:16px;padding:12px 14px;border-radius:14px;background:var(--accent-soft);font-size:.9rem}
.callout strong{display:block;font-weight:600;margin-bottom:2px;color:var(--accent-ink)}
.conn{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.conn button{border:0;cursor:pointer;font-size:.8rem;padding:4px 10px;border-radius:999px;background:transparent;box-shadow:inset 0 0 0 1px var(--line-strong);text-align:left}
.conn button:hover{box-shadow:inset 0 0 0 1.5px var(--accent)}
.conn-grp{margin-top:8px}
.conn-grp .cl{font-size:.76rem;color:var(--muted)}
.lane-steps{display:grid;gap:6px;margin-top:6px}
.lane-steps button{border:0;cursor:pointer;text-align:left;padding:8px 12px;border-radius:12px;background:var(--bg);font-size:.86rem;display:flex;justify-content:space-between;gap:8px;align-items:center}
.lane-steps button:hover{box-shadow:inset 0 0 0 1.5px var(--accent)}
.status-pill{font-size:.72rem;font-weight:600;border-radius:999px;padding:2px 9px}
.status-pill.st-same{background:var(--bg);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line-strong)}
.status-pill.st-new{background:#17B14A;color:#fff}
.status-pill.st-enhanced{box-shadow:inset 0 0 0 1.25px var(--green);color:var(--green-ink)}
.status-pill.st-optional{box-shadow:inset 0 0 0 1.25px #2A8CC0;color:#1F6E99}
.status-pill.st-future{box-shadow:inset 0 0 0 1.25px var(--muted);color:var(--muted)}
.foot{margin-top:22px;font-size:.76rem;color:var(--muted)}

/* walk bar */
.walkbar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:none;align-items:center;gap:8px;background:var(--surface);box-shadow:var(--shadow-card),inset 0 0 0 1px var(--line);border-radius:999px;padding:7px 8px;z-index:60;max-width:calc(100vw - 20px)}
body.walking .walkbar{display:flex}
.wb-text{display:grid;line-height:1.2;padding:0 8px;min-width:0}
.wb-count{font-size:.72rem;color:var(--muted)}
.wb-title{font-size:.9rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.walkbar .btn{padding:7px 12px}

@media (max-width:1400px){ .main{grid-template-columns:minmax(0,1fr) 330px} }
@media (max-width:900px){
  .main{grid-template-columns:1fr}
  .board{display:flex;flex-direction:column;gap:14px;min-width:0}
  .lane{display:flex;flex-direction:column;padding:0 12px 12px}
  .lane-head{order:0}
  .bw{order:var(--row);padding:6px 0;align-self:stretch}
  .edges{display:none}
  .panel{position:fixed;left:0;right:0;top:auto;bottom:0;max-height:78vh;border-radius:24px 24px 0 0;transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.7,.3,1);z-index:50;visibility:hidden}
  .panel.open{transform:none;visibility:visible}
  .sheet-close{display:inline-flex}
  body.walking .panel{bottom:calc(70px + env(safe-area-inset-bottom,0px));max-height:calc(78vh - 70px);border-radius:24px}
  .mode-btn{min-width:0;padding:7px 14px 8px}
  .controls .spacer{display:none}
  .logo-z{width:80px} .logo-wd{width:112px}
  .wb-title{max-width:38vw}
}
@media (max-width:480px){
  .mode-btn .m-c{display:none}
  .walkbar .btn .lbl{display:none}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important;scroll-behavior:auto !important}
}
</style>
</head>
<body data-mode="req" data-view="biz">

    h += '<span class="lg">' + lineSample("email") + (biz ? "Email" : "Email message") + "</span>";
    h += '<span class="lg">' + lineSample("data") + (biz ? "Uses information from" : "Data reference") + "</span>";
    h += '<span class="lg"><span class="sw"></span>' + (biz ? "Someone does this" : "User action") + "</span>";
    h += '<span class="lg"><span class="sw sys"></span>' + (biz ? "Salesforce does this" : "Automation") + "</span>";
    if (state.mode === "req") h += '<span class="lg"><span class="sw out"></span>' + (biz ? "Happens outside Salesforce" : "Off-platform") + "</span>";
    if (state.mode === "prop") {
      ["new", "enhanced", "optional", "future"].forEach(function (k) {
        h += '<span class="lg"><span class="badge b-' + k + '">' + DATA.statusLabels[k] + "</span></span>";
      });
    }
    $("#legend").innerHTML = h;
  }
  function effectiveTheme() { return state.theme || (mqDark.matches ? "dark" : "light"); }
  function applyTheme() {
    if (state.theme) document.documentElement.setAttribute("data-theme", state.theme);
    else document.documentElement.removeAttribute("data-theme");
    var dark = effectiveTheme() === "dark";
    var btn = $("#themeBtn");
    btn.innerHTML = icon(dark ? "sun" : "moon");
    btn.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
  }
  function renderWalkbar() {
    document.body.classList.toggle("walking", state.walking);
    if (!state.walking) return;
    var steps = walkSteps();
    var id = steps[state.walkIdx];
    $("#wbCount").textContent = "Step " + (state.walkIdx + 1) + " of " + steps.length;
    $("#wbTitle").textContent = id ? T(BM[id].title) : "";
    $("#prevBtn").disabled = state.walkIdx <= 0;
    $("#nextBtn").disabled = state.walkIdx >= steps.length - 1;
  }

  function openSheet(focus) {
    var p = $("#panel");
    p.classList.add("open");
    p.scrollTop = 0;
    if (focus && mqMobile.matches) { var t = document.getElementById("pTitle"); if (t) t.focus({ preventScroll: true }); }
  }
  function closeSheet() { $("#panel").classList.remove("open"); }

  function renderAll() {
    renderChrome();
    renderBoard();
    renderPanel();
    renderWalkbar();
    applyStates();
    scheduleDraw();
  }

  /* ---------- actions ---------- */
  function selectBlock(id, opts) {
    state.sel = { type: "block", id: id };
    if (state.walking) {
      var i = walkSteps().indexOf(id);
      if (i >= 0) state.walkIdx = i; else state.walking = false;
      renderWalkbar();
    }
    renderPanel();
    applyStates();
    openSheet(opts && opts.focus);
    var el = document.getElementById("blk-" + id);
    if (el && opts && opts.scroll) el.scrollIntoView({ behavior: mqReduce.matches ? "auto" : "smooth", block: mqMobile.matches ? "start" : "nearest", inline: "center" });
    if (opts && opts.focusBlock && el) el.focus({ preventScroll: true });
  }
  function selectLane(id) {
    state.sel = { type: "lane", id: id };
    renderPanel(); applyStates(); openSheet(true);
  }
  function showOverview() {
    state.sel = null;
    if (state.walking) { state.walking = false; renderWalkbar(); }
    renderPanel(); applyStates(); openSheet(true);
  }
  function goWalk(i) {
    var steps = walkSteps();
    if (!steps.length) return;
    state.walkIdx = Math.max(0, Math.min(steps.length - 1, i));
    state.sel = { type: "block", id: steps[state.walkIdx] };
    renderWalkbar();
    renderPanel();
    applyStates();
    openSheet(false);
    var el = document.getElementById("blk-" + steps[state.walkIdx]);
    if (el) el.scrollIntoView({ behavior: mqReduce.matches ? "auto" : "smooth", block: mqMobile.matches ? "start" : "center", inline: "center" });
  }
  function startWalk() {
    var steps = walkSteps();
    var start = 0;
    if (state.sel && state.sel.type === "block" && steps.indexOf(state.sel.id) >= 0) start = steps.indexOf(state.sel.id);
    state.walking = true;
    goWalk(start);
  }
  function stopWalk() {
    state.walking = false;
    renderWalkbar(); applyStates();
    $("#walkBtn").focus();
  }
  function setMode(m) {
    if (m === state.mode) return;
    state.mode = m;
    if (state.sel && state.sel.type === "block" && !visible(BM[state.sel.id])) state.sel = null;
    save();
    var keep = state.sel && state.sel.type === "block" ? state.sel.id : null;
    renderAll();
    if (state.walking) {
      var steps = walkSteps();
      var i = keep ? steps.indexOf(keep) : -1;
      goWalk(i >= 0 ? i : 0);
    }
  }
  function setView(v) { if (v === state.view) return; state.view = v; save(); renderAll(); if (state.walking) goWalk(state.walkIdx); }
  function setScenario(s) {
    if (s === state.scenario) return;
    var keep = focusId();
    state.scenario = s; save();
    renderChrome(); renderPanel(); applyStates();
    if (state.walking) {
      var steps = walkSteps();
      var i = keep ? steps.indexOf(keep) : -1;
      goWalk(i >= 0 ? i : 0);
    }
  }

  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("button");
    if (!t) return;
    if (t.classList.contains("mode-btn")) return setMode(t.dataset.mode);
    if (t.parentElement && t.parentElement.classList.contains("seg")) return setView(t.dataset.view);
    if (t.dataset.scen) return setScenario(t.dataset.scen);
    if (t.dataset.block) return selectBlock(t.dataset.block, { focus: true });
    if (t.dataset.lane) return selectLane(t.dataset.lane);
    if (t.dataset.laneOpen) return selectLane(t.dataset.laneOpen);
    if (t.dataset.goto) return selectBlock(t.dataset.goto, { scroll: true, focusBlock: !mqMobile.matches });
    if (t.dataset.gotoReq) { setMode("req"); return selectBlock(t.dataset.gotoReq, { scroll: true }); }
    if (t.dataset.sub) {
      var id = t.dataset.sub;
      expanded[id] = !expanded[id];
      var list = document.getElementById("sub-" + id);
      var n = list.children.length;
      list.hidden = !expanded[id];
      t.setAttribute("aria-expanded", String(!!expanded[id]));
      t.lastChild.textContent = (expanded[id] ? "Hide " : "Show ") + n + " steps";
      scheduleDraw();
      return;
    }
    if (t.hasAttribute("data-close")) { closeSheet(); return; }
    if (t.id === "walkBtn") return state.walking ? stopWalk() : startWalk();
    if (t.id === "prevBtn") return goWalk(state.walkIdx - 1);
    if (t.id === "nextBtn") return goWalk(state.walkIdx + 1);
    if (t.id === "exitBtn") return stopWalk();
    if (t.id === "overviewBtn") return showOverview();
    if (t.id === "themeBtn") {
      state.theme = effectiveTheme() === "dark" ? "light" : "dark";
      save(); applyTheme(); return;
    }
  });

  document.addEventListener("keydown", function (ev) {
    var tag = (ev.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea" || tag === "select") return;
    if (state.walking && (ev.key === "ArrowRight" || ev.key === "ArrowLeft")) {
      ev.preventDefault();
      goWalk(state.walkIdx + (ev.key === "ArrowRight" ? 1 : -1));
    } else if (ev.key === "Escape") {
      if (state.walking) stopWalk();
      else if (mqMobile.matches && $("#panel").classList.contains("open")) closeSheet();
    }
  });

  window.addEventListener("resize", scheduleDraw);
  if (window.ResizeObserver) new ResizeObserver(scheduleDraw).observe($("#board"));
  var onMq = function () { scheduleDraw(); };
  if (mqMobile.addEventListener) mqMobile.addEventListener("change", onMq);
  if (mqDark.addEventListener) mqDark.addEventListener("change", function () { if (!state.theme) applyTheme(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleDraw);

  renderAll();
  if (!mqMobile.matches) $("#panel").classList.add("open");
})();

</script>
</body>
</html>
